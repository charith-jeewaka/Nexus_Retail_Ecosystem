spring.application.name=Nexus_Retail_EcoSystem


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

#JPA Configurations
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Default Admin Credentials
nexus.default.admin.username=${DEFAULT_ADMIN_USERNAME}
nexus.default.admin.password=${DEFAULT_ADMIN_PASSWORD}
nexus.default.admin.email=${DEFAULT_ADMIN_EMAIL}

# JWT Configuration
# This must be a Base64 encoded string of at least 256 bits (32 characters)
nexus.jwt.secret=${JWT_SECRET_KEY}
# Expiration time in milliseconds (e.g., 86400000 = 24 hours)
nexus.jwt.expiration=86400000


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${NEXUS_MAIL_USERNAME}

spring.mail.password=${NEXUS_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Increase Multipart File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY}

# Force the model to 1.5 Flash (Most stable for Free Tier)
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
# Optional: Add a timeout so it doesn't hang if the network is slow
spring.ai.google.genai.chat.options.timeout=60000