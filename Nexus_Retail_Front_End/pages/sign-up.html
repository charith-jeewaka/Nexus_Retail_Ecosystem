<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow p-4" style="width:400px">

        <h3 class="text-center mb-4">Create Account</h3>

        <form>
            <div class="mb-3">
                <label for="inp-signup-username" class="form-label">Username</label>
                <input type="text" class="form-control" placeholder="Enter Username" id="inp-signup-username">
            </div>

            <div class="mb-3">
                <label for="inp-signup-email" class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter Email" id="inp-signup-email">
            </div>

            <div class="mb-3">
                <label for="inp-signup-password" class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter Password" id="inp-signup-password">
            </div>

            <button type="button" id="btn-sign-up" class="btn btn-success w-100">
                Sign Up
            </button>
        </form>

        <hr>

        <p class="text-center">
            Already have an account?
            <a href="sign-in.html">Sign In</a>
        </p>
    </div>
</div>

<script src="../Js/sign-up.js"></script>

</body>
</html>
