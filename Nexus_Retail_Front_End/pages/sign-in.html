<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="width:400px">
        <h3 class="text-center mb-4">Sign In</h3>
        <form>
            <div class="mb-3">
                <label for="inp-signin-username" class="form-label">Username</label>
                <input type="text" class="form-control" placeholder="Enter Username" id="inp-signin-username">
            </div>
            <div class="mb-3">
                <label for="inp-signin-password" class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter Password" id="inp-signin-password">
            </div>
            <button type="button" id="btn-sign-in" class="btn btn-primary w-100">
                Sign In
            </button>
        </form>
        <hr>
        <p class="text-center">
            Don't have an account?
            <a href="javascript:void(0);" onclick="window.navigateTo('sign-up')">Sign Up</a>
        </p>
    </div>
</div>
