<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <script>
        // 1. Instant Check: Runs before the <body> even loads
        function enforceSecurity() {
            const token = localStorage.getItem("nexus_token");
            if (!token) {
                // Instantly redirect without waiting for UI
                window.location.replace("../pages/sign-in.html");
            }
        }

        // Run immediately
        enforceSecurity();

        // 2. The Cache Buster: Runs if they use the Back arrow
        window.addEventListener( "pageshow", function ( event ) {
            // event.persisted is true if the page was loaded from the cache
            const token = localStorage.getItem("nexus_token");
            if (event.persisted && !token) {
                window.location.replace("../pages/sign-in.html");
            }
        });
    </script>

</head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<body>

<h1 style="font-size: 40px">admin dashboard</h1>
<button type="button" id="btn-admin-logout" class="btn btn-danger">Logout</button>

<script src="../Js/admin-dashboard.js"></script>
</body>
</html>
