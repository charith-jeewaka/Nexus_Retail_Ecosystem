<div class="container-fluid mt-4 px-4 pb-5">
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 text-dark">
                        <i class="bi bi-bag-check text-primary me-2"></i>Recent Orders
                    </h5>
                    <button class="btn btn-sm btn-light border rounded-pill px-3" onclick="loadCustomerOrders()">
                        <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                        <tr>
                            <th class="ps-4 py-3 text-uppercase small fw-bold text-muted">ID</th>
                            <th class="py-3 text-uppercase small fw-bold text-muted">Date</th>
                            <th class="py-3 text-uppercase small fw-bold text-muted">Total</th>
                            <th class="py-3 text-uppercase small fw-bold text-muted">Status</th>
                            <th class="text-end pe-4 py-3 text-uppercase small fw-bold text-muted">Action</th>
                        </tr>
                        </thead>
                        <tbody id="customer-orders-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div id="order-details-placeholder" class="card border-0 shadow-sm rounded-4 d-flex align-items-center justify-content-center p-5 text-muted bg-light border-dashed h-100 min-vh-50">
                <div class="text-center">
                    <i class="bi bi-receipt-cutoff mb-3 display-4 text-secondary opacity-50"></i>
                    <p class="mb-0 fw-medium">Select an order to view breakdown</p>
                </div>
            </div>

            <div id="order-details-card" class="card border-0 shadow-lg rounded-4 d-none sticky-sidebar">
                <div class="card-header bg-primary text-white border-0 pt-4 px-4 rounded-top-4">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="fw-bold mb-1">Order <span id="detail-id"></span></h5>
                            <p class="small opacity-75 mb-3">Placed: <span id="detail-date"></span></p>
                        </div>
                        <div id="detail-status-badge"></div>
                    </div>
                </div>

                <div class="card-body px-4 d-flex flex-column" style="max-height: 70vh;">
                    <h6 class="fw-bold mt-2 mb-3 small text-uppercase text-muted border-bottom pb-2">Items Breakdown</h6>

                    <div id="detail-items-list" class="order-items-scroll pe-2">
                    </div>

                    <div class="mt-auto border-top pt-3 pb-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-muted fw-bold small">TOTAL PAID</span>
                            <span id="detail-total" class="text-primary fw-bold h4 mb-0"></span>
                        </div>
                        <div class="d-grid mt-3">
                            <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="window.print()">
                                <i class="bi bi-printer me-2"></i>Print Receipt
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* 1. Prevent Overlapping Sticky Navbar */
    .sticky-sidebar {
        position: sticky;
        top: 90px; /* Adjust based on your navbar height */
        z-index: 1000;
        transition: all 0.3s ease;
    }

    /* 2. Scrollable Item List Styling */
    .order-items-scroll {
        overflow-y: auto;
        flex-grow: 1;
        scrollbar-width: thin;
        scrollbar-color: #dee2e6 #fff;
    }

    .order-items-scroll::-webkit-scrollbar {
        width: 5px;
    }

    .order-items-scroll::-webkit-scrollbar-thumb {
        background: #dee2e6;
        border-radius: 10px;
    }

    /* 3. Aesthetic Tweaks */
    .border-dashed {
        border: 2px dashed #dee2e6 !important;
    }

    #customer-orders-table-body tr {
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    #customer-orders-table-body tr:hover {
        background-color: #f8f9fa;
    }

    .min-vh-50 {
        min-height: 50vh;
    }

    .rounded-top-4 {
        border-top-left-radius: 1rem !important;
        border-top-right-radius: 1rem !important;
    }

    /* Glassmorphism subtle effect for the sidebar */
    #order-details-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(5px);
    }
</style>
