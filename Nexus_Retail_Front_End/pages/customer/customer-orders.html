<div class="container-fluid mt-4 px-4">
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white py-3 border-0">
                    <h5 class="fw-bold mb-0">Order History</h5>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Order ID</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Action</th>
                        </tr>
                        </thead>
                        <tbody id="customer-orders-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div id="order-details-placeholder" class="card border-0 shadow-sm rounded-4 d-flex align-items-center justify-content-center p-5 text-muted bg-light border-dashed h-100" style="border: 2px dashed #dee2e6;">
                <div class="text-center">
                    <i class="bi bi-receipt mb-3" style="font-size: 3rem;"></i>
                    <p class="mb-0">Select an order to view the items breakdown</p>
                </div>
            </div>

            <div id="order-details-card" class="card border-0 shadow-sm rounded-4 d-none sticky-top" style="top: 20px;">
                <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0">Order <span id="detail-id"></span></h5>
                    <div id="detail-status-badge"></div>
                </div>
                <div class="card-body px-4">
                    <p class="text-muted small mb-4">Placed on: <span id="detail-date" class="fw-medium"></span></p>

                    <h6 class="fw-bold mb-3 small text-uppercase text-muted" style="letter-spacing: 1px;">Items Ordered</h6>
                    <div id="detail-items-list" class="mb-4" style="max-height: 400px; overflow-y: auto;">
                    </div>

                    <div class="border-top pt-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-dark fw-bold h5">Total</span>
                            <span id="detail-total" class="text-primary fw-bold h4"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
