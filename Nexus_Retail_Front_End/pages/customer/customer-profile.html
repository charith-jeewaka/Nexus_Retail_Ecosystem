<div class="container-fluid px-4 py-4 bg-light-modern min-vh-100" id="profile-management-container">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
            <h2 class="h3 text-dark fw-bold m-0 tracking-tight">My Profile</h2>
            <p class="text-muted small m-0 mt-1">Manage your account settings and preferences</p>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-light shadow-sm border-0 text-secondary fw-semibold btn-hover-lift" onclick="window.navigateTo('dashboard')">
                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
            </button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card shadow-sm border-0 h-100 rounded-4 overflow-hidden">
                <div class="card-body p-4 d-flex flex-column align-items-center text-center">

                    <div class="profile-avatar-container mb-3 position-relative" onclick="document.getElementById('inp-profile-upload').click()">
                        <img id="profile-avatar-preview" src="https://ui-avatars.com/api/?name=Charith+Jeewaka&background=0D8ABC&color=fff&size=150" alt="Profile Picture" class="rounded-circle shadow-sm profile-img object-fit-cover">

                        <div class="avatar-overlay rounded-circle d-flex flex-column align-items-center justify-content-center">
                            <i class="bi bi-camera-fill text-white fs-3 mb-1"></i>
                            <span class="text-white small fw-medium">Change</span>
                        </div>
                    </div>

                    <input type="file" id="inp-profile-upload" class="d-none" accept="image/png, image/jpeg, image/webp">

                    <h5 class="fw-bold text-dark mb-1">Charith Jeewaka</h5>
                    <p class="text-muted small mb-3">Premium Customer <i class="bi bi-patch-check-fill text-primary ms-1"></i></p>

                    <div class="w-100 px-3 mt-2">
                        <div class="d-flex justify-content-between text-muted small mb-2">
                            <span>Member Since</span>
                            <span class="fw-medium text-dark">Oct 2025</span>
                        </div>
                        <div class="d-flex justify-content-between text-muted small">
                            <span>Total Orders</span>
                            <span class="fw-medium text-dark">42</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card shadow-sm border-0 h-100 rounded-4 overflow-hidden">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-2 px-4">
                    <h6 class="m-0 fw-bold text-dark d-flex align-items-center">
                        <div class="icon-square bg-primary-subtle text-primary rounded-3 d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
                            <i class="bi bi-person-lines-fill"></i>
                        </div>
                        Personal Information
                    </h6>
                </div>

                <div class="card-body p-4">
                    <form id="form-update-profile">

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control custom-input" id="inp-profile-fname" placeholder="First Name" value="Charith" required>
                                    <label for="inp-profile-fname">First Name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control custom-input" id="inp-profile-lname" placeholder="Last Name" value="Jeewaka" required>
                                    <label for="inp-profile-lname">Last Name</label>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="email" class="form-control custom-input" id="inp-profile-email" placeholder="Email Address" value="charith@example.com" required>
                                    <label for="inp-profile-email">Email Address</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="tel" class="form-control custom-input" id="inp-profile-phone" placeholder="Phone Number" value="+94 77 123 4567">
                                    <label for="inp-profile-phone">Phone Number</label>
                                </div>
                            </div>
                        </div>

                        <h6 class="fw-bold text-dark mb-3 mt-4 border-top pt-4">Shipping Address</h6>

                        <div class="form-floating mb-3">
                            <input type="text" class="form-control custom-input" id="inp-profile-address" placeholder="Street Address" value="No. 123, Sample Road">
                            <label for="inp-profile-address">Street Address</label>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control custom-input" id="inp-profile-city" placeholder="City" value="Colombo">
                                    <label for="inp-profile-city">City</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control custom-input" id="inp-profile-zip" placeholder="Postal Code" value="00100">
                                    <label for="inp-profile-zip">Postal Code</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-2 border-top mt-4">
                            <button type="button" class="btn btn-light fw-medium rounded-3 px-4 btn-hover-lift" id="btn-cancel-profile">Cancel</button>
                            <button type="submit" class="btn btn-primary bg-gradient-primary border-0 fw-medium rounded-3 px-4 shadow-sm btn-hover-lift" id="btn-save-profile">
                                Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* --- Profile Page Specific Styles --- */

    .profile-avatar-container {
        width: 150px;
        height: 150px;
        cursor: pointer;
        border-radius: 50%;
        border: 4px solid #ffffff;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .profile-img {
        width: 100%;
        height: 100%;
        background-color: #f8fafc;
    }

    .avatar-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        opacity: 0;
        transition: opacity 0.3s ease;
        backdrop-filter: blur(2px); /* Gives it a modern glass feel */
    }

    /* Show the overlay when hovering over the container */
    .profile-avatar-container:hover .avatar-overlay {
        opacity: 1;
    }

    /* Prevent text selection when clicking the avatar */
    .profile-avatar-container {
        user-select: none;
    }
</style>
