<div class="container-fluid py-4">
    <h3 class="fw-bold text-dark mb-4">Shopping Cart</h3>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table align-middle m-0" id="cart-table">
                            <thead class="table-light text-muted" style="font-size: 0.85rem;">
                            <tr>
                                <th class="ps-4">Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Subtotal</th>
                                <th class="pe-4 text-end">Action</th>
                            </tr>
                            </thead>
                            <tbody id="cart-items-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="empty-cart-msg" class="text-center py-5 d-none">
                <i class="bi bi-cart-x text-muted" style="font-size: 4rem;"></i>
                <h5 class="mt-3 text-dark fw-bold">Your cart is empty</h5>
                <p class="text-muted">Looks like you haven't added anything yet.</p>
                <button class="btn btn-primary mt-2" onclick="window.navigateCustomer('shop')">Continue Shopping</button>
            </div>
        </div>

        <div class="col-lg-4" id="order-summary-section">
            <div class="card shadow-sm border-0 bg-light">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4">Order Summary</h5>

                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Items (<span id="summary-item-count">0</span>):</span>
                        <span class="fw-semibold">Rs. <span id="summary-subtotal">0.00</span></span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                        <span class="text-muted">Discount:</span>
                        <span class="text-success fw-semibold">- Rs. 0.00</span>
                    </div>

                    <div class="d-flex justify-content-between mb-4">
                        <span class="fw-bold fs-5">Total:</span>
                        <span class="fw-bold fs-5 text-primary">Rs. <span id="summary-total">0.00</span></span>
                    </div>

                    <button class="btn btn-primary w-100 py-2 fw-bold" id="btn-checkout">
                        Proceed to Checkout <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
