<div class="container-fluid px-4 py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 text-gray-800 fw-bold m-0">Nexus Admin Command Center</h1>
            <p class="text-muted m-0">Welcome back, Chief Administrator. Here is your retail ecosystem overview.</p>
        </div>
        <button class="btn btn-outline-secondary btn-sm shadow-sm">
            <i class="bi bi-download me-1"></i> Generate Report
        </button>
    </div>

    <div class="row g-3 mb-4">

        <div class="col-xl-3 col-md-6">
            <div class="card shadow-sm h-100 py-2 border-0 border-start border-4 border-primary">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-primary text-uppercase mb-1" style="font-size: 0.8rem;">Today's Revenue</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" id="dash-today-revenue">Rs. 145,250.00</div>
                        </div>
                        <div class="col-auto">
                            <i class="bi bi-currency-dollar text-secondary opacity-25 h1 m-0"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-3 col-md-6">
            <div class="card shadow-sm h-100 py-2 border-0 border-start border-4 border-success">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-success text-uppercase mb-1" style="font-size: 0.8rem;">Pending Orders</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" id="dash-pending-orders"></div>
                        </div>
                        <div class="col-auto">
                            <i class="bi bi-cart-check text-secondary opacity-25 h1 m-0"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-3 col-md-6" onclick="window.navigateAdmin('inventory-page')" style="cursor: pointer;">
            <div class="card shadow-sm h-100 py-2 border-0 border-start border-4 border-info bg-light">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-info text-uppercase mb-1" style="font-size: 0.8rem;">Active Products</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" id="dash-active-products-count">
                                <div class="spinner-border spinner-border-sm text-info"></div>
                            </div>
                        </div>
                        <div class="col-auto">
                            <i class="bi bi-box-seam text-secondary opacity-25 h1 m-0"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-3 col-md-6">
            <div class="card shadow-sm h-100 py-2 border-0 border-start border-4 border-danger">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-danger text-uppercase mb-1" style="font-size: 0.8rem;">Low Stock Alerts</div>
                            <div class="h5 mb-0 fw-bold text-gray-800" id="dash-low-stock-count">
                                <div class="spinner-border spinner-border-sm text-danger"></div>
                            </div>
                        </div>
                        <div class="col-auto">
                            <i class="bi bi-exclamation-triangle text-danger opacity-50 h1 m-0"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<!--    graph content-->
    <div id="dash-chart-main-container" class="rounded bg-white">
        <!-- Main Chart: Sales Trend -->
        <div id="dash-graph-container" class="p-4 border-end">
            <div class="w-100 h-100">
                <h6 class="fw-bold text-uppercase text-muted mb-3" style="font-size: 0.75rem;">Revenue Performance (Weekly)</h6>
                <canvas id="revenueChart"></canvas>
            </div>
        </div>

        <div id="dash-main-sub-container">
            <!-- Sub 1: Inventory Health and orders -->
            <div id="sub-container-1" class="p-3 border-bottom">
                <!-- Doughnut 1 -->
                <div class="chart-wrapper" style="height: 100%; width: 50% ;">
                    <h6 class="fw-bold text-center text-muted mb-2" style="font-size: 1.5rem;">Stock Health</h6>
                    <div class="canvas-holder">
                        <canvas id="stockDoughnut" ></canvas>
                    </div>
                </div>

                <!-- Doughnut 2 -->
                <div class="chart-wrapper" style="height: 100%;">
                    <h6 class="fw-bold text-center text-muted mb-2" style="font-size: 1.5rem;">Order Summery</h6>
                    <div class="canvas-holder">
                        <canvas id="orderDoughnut" style="width: 50%;height: 100%"></canvas>
                    </div>
                </div>
            </div>

            <!-- Sub 2: Top Review -->
            <div id="sub-container-2" style="display: flex;flex-direction: column;align-items: center;">
<!--                title-->
                <h6 class="fw-bold text-center text-muted" style="font-size: 1.5rem;">Top Rated Items And Comments</h6>
<!--                review card-->
                <div class="p-1" style="width: 100%;height: 100%;border: 1px solid #e4dada; display: flex; flex-direction: row; align-items: center;">
<!--                    image-->
                    <div style="border: 1px solid black;height: 100%;width: 25%">image</div>
<!--                    comment-->
                    <div style="height: 100%;width: 75%;border: 1px solid black"></div>
                </div>

            </div>
        </div>
    </div>

</div>

        height: 61vh;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);

        border: 1px solid #e3e6f0; /* Soft border instead of black */
    }
    #dash-graph-container {
        width: 55%;
        display: flex;
    }
    #dash-main-sub-container {
        width: 45%;
        display: flex;
        flex-direction: column;
    }
    #sub-container-1 {
        height: 55%;
        width: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-around;
        padding: 15px;
        gap: 15px; /* Adds space between the two charts */
    }
    #sub-container-2{
        height: 45%;
        display: flex;
        align-items: center;
    }
    .chart-wrapper {
        flex: 1; /* Gives equal space to both doughnuts */
        height: 100%;
