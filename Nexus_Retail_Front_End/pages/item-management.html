<div class="container-fluid px-4 py-4" id="item-management-container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 text-gray-800 fw-bold m-0">Item Management</h2>
            <p class="text-muted small m-0">Add new products to the Nexus Ecosystem</p>
        </div>
        <button class="btn btn-outline-secondary btn-sm shadow-sm" onclick="window.navigateTo('admin-dashboard')">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </button>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card shadow border-0 h-100">
                <div class="card-header bg-white border-0 pt-4 pb-0">
                    <h6 class="m-0 fw-bold text-primary"><i class="bi bi-box-seam me-2"></i>Product Details</h6>
                </div>
                <div class="card-body p-4">
                    <form id="form-save-product">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-dark">Product Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="inp-product-name" placeholder="e.g., Munchee Cream Cracker" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-dark">Category <span class="text-danger">*</span></label>
                                <select class="form-control form-select" id="inp-product-category" required>
                                    <option value="" selected disabled>Select a category...</option>
                                    <option value="Groceries">Groceries</option>
                                    <option value="Beverages">Beverages</option>
                                    <option value="Electronics">Electronics</option>
                                    <option value="Stationery">Stationery</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-dark">Unit Price (Rs.) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0" class="form-control" id="inp-product-price" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-dark">Initial Stock <span class="text-danger">*</span></label>
                                <input type="number" min="0" class="form-control" id="inp-product-stock" placeholder="0" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark">Product Image <span class="text-muted fw-normal">(Optional)</span></label>
                            <input class="form-control" type="file" id="inp-product-image" accept="image/png, image/jpeg, image/webp">
                            <div class="form-text">Max file size: 5MB. Recommended formats: JPEG, PNG, WebP.</div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-light border" id="btn-clear-product">Clear Form</button>
                            <button type="submit" class="btn btn-primary" id="btn-save-product-submit">
                                <i class="bi bi-cloud-arrow-up me-1"></i> Save Product
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow border-0 h-100">
                <div class="card-header bg-white border-0 pt-4 pb-0">
                    <h6 class="m-0 fw-bold text-secondary"><i class="bi bi-image me-2"></i>Visual Preview</h6>
                </div>
                <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">

                    <div class="border rounded p-2 mb-3 bg-light shadow-sm" style="width: 100%; max-width: 250px; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                        <img id="image-preview" src="https://via.placeholder.com/300x300?text=No+Image" alt="Preview" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                    </div>

                    <p class="text-muted small text-center mb-0" id="image-name-display">No file selected</p>

                </div>
            </div>
        </div>
    </div>
</div>
