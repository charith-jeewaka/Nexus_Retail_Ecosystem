<div class="container-fluid px-4 py-4" id="inventory-container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 text-gray-800 fw-bold m-0 ">Inventory Manager</h2>
            <p class="text-muted small m-0">View, search, and manage your active retail ecosystem products</p>
        </div>

        <div>
            <button class="btn btn-primary shadow-sm" onclick="window.navigateTo('item-management')">
                <i class="bi bi-plus-circle me-1"></i> Add New Product
            </button>
            <button class="btn btn-secondary shadow-sm" onclick="window.navigateTo('admin-dashboard')">
                <i class="fa-solid fa-backward-step" style="color: white"></i> Back To Dashboard
            </button>
        </div>
    </div>

    <div class="card shadow border-0 mb-4 bg-white">
        <div class="card-body p-3 d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">

            <div class="input-group" style="max-width: 400px;">
                <span class="input-group-text bg-light border-end-0 text-muted">
                    <i class="bi bi-search"></i>
                </span>
                <input type="text" class="form-control border-start-0 bg-light" id="inp-search-product" placeholder="Search by product name...">
            </div>

            <div class="d-flex gap-2 w-100 justify-content-md-end">
                <select class="form-select bg-light w-auto" id="filter-category">
                    <option value="ALL" selected>All Categories</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Beverages">Beverages</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Stationery">Stationery</option>
                </select>
                <button class="btn btn-outline-secondary" id="btn-refresh-inventory" title="Refresh Data">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>

        </div>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                <table class="table table-hover align-middle m-0">
                    <thead class="table-light text-uppercase text-muted sticky-top" style="font-size: 0.85rem;">
                    <tr>
                        <th class="ps-4" style="width: 80px;">Image</th>
                        <th>Product Info</th>
                        <th>Category</th>
                        <th>Unit Price</th>
                        <th>Stock</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="inventory-table-body">
                    <tr>
                        <td colspan="6" class="text-center py-5 text-muted">
                            <div class="spinner-border spinner-border-sm me-2 text-primary" role="status"></div>
                            Loading inventory...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-light border-0">
                <h5 class="modal-title fw-bold text-primary"><i class="bi bi-pencil-square me-2"></i>Edit Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="form-edit-product">

                    <input type="hidden" id="edit-product-id">
                    <input type="hidden" id="edit-product-image-url">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Product Name</label>
                        <input type="text" class="form-control" id="edit-product-name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Category</label>
                        <select class="form-select" id="edit-product-category" required>
                            <option value="Groceries">Groceries</option>
                            <option value="Beverages">Beverages</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Stationery">Stationery</option>
                        </select>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Unit Price (Rs.)</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="edit-product-price" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Stock</label>
                            <input type="number" min="0" class="form-control" id="edit-product-stock" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="btn-update-submit">Update Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    /* Styling for the tiny product thumbnail images in the table */
    .product-thumbnail {
        width: 70px;
        height: 70px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #dee2e6;
        background-color: #f8f9fa;
    }
</style>
